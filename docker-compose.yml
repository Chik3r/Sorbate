services:
  sorbate:
    image: sorbate
    tty: true
    stdin_open: true
    build:
      context: .
      dockerfile: Sorbate/Dockerfile
    depends_on:
      - db
    environment:
      Discord__AuthToken: ${DISCORD_TOKEN}
      ConnectionStrings__DefaultConnection: Host=db;Database=postgres;Username=postgres;Password=${DB_PASSWORD}
      Scraping__SteamCmdPath: steamcmd/steamcmd.sh
    env_file:
      - path: .env
        required: true
    volumes:
      - ./tmp_files/:/app/steamcmd/write_dir/
      - steamcmd-volume:/app/steamcmd
    user: "1005:1006"
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    env_file:
      - path: .env
        required: true
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
  steamcmd:
    # image: cm2network/steamcmd # For x64 machines
    image: sonroyaalmerol/steamcmd-arm64 # For arm64 machines
    tty: true
    stdin_open: true
    volumes:
      - ./tmp_files/:/home/steam/steamcmd/write_dir/
      - steamcmd-volume:/home/steam/steamcmd

volumes:
  steamcmd-volume:
  postgres-data: